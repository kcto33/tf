[project]
name = "web-transfer"
version = "1.0.0"
description = "LAN browser-to-browser file transfer with FastAPI signaling and WebRTC data channels"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "output", "tmp"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import order
  "B",   # common bugs
  "UP",  # modernize syntax
]
ignore = [
  "E501", # 行长交给 line-length 之外的特殊情况（信令 JSON 单行构造等）
  "B008", # FastAPI 依赖注入在参数默认值中调用是惯例
]

[tool.pytest.ini_options]
testpaths = ["tests"]
