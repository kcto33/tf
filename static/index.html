<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="文件传输" />
    <title>文件传输</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='5' fill='%232563eb'/%3E%3Cpath d='M12 6v8M8.5 10.5 12 14l3.5-3.5M7 17.5h10' stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
            </svg>
          </span>
          <span class="brand-name">文件传输</span>
        </div>
        <div class="top-status">
          <span id="connectionBadge" class="badge muted">
            <span class="dot muted"></span>未连接
          </span>
          <button id="localClientId" class="client-chip" type="button" title="点击复制完整客户端 ID">————</button>
        </div>
      </header>

      <section class="card connect-card" aria-label="连接房间">
        <div class="field">
          <label for="displayName">显示名</label>
          <input id="displayName" type="text" maxlength="32" placeholder="这台设备的名字" autocomplete="off" />
        </div>
        <div class="field">
          <label for="roomCode">房间码</label>
          <input id="roomCode" type="text" maxlength="24" placeholder="例如 TF-ROOM-01" autocomplete="off" />
        </div>
        <div class="connect-actions">
          <button id="connectBtn" type="button" class="btn primary">进入房间</button>
          <button id="disconnectBtn" type="button" class="btn ghost" disabled>离开房间</button>
        </div>
      </section>

      <section class="board">
        <article class="card" aria-label="房间设备">
          <div class="card-head">
            <h2>房间设备</h2>
            <div class="card-actions">
              <button id="inviteBtn" type="button" class="btn ghost mini" hidden>邀请设备</button>
              <span id="peerCount" class="badge muted">0 台</span>
            </div>
          </div>
          <div id="peerList" class="list empty-box"></div>
          <div id="pendingTransfers" class="pending-stack" hidden></div>
          <div id="resumeTransfers" class="pending-stack" hidden></div>
        </article>

        <article id="sendCard" class="card" aria-label="发送文件">
          <div class="card-head">
            <h2>发送文件</h2>
            <span id="sendHint" class="badge muted">等待设备</span>
          </div>
          <p class="target-line">发送对象：<strong id="selectedPeerName">未选择</strong></p>
          <div class="send-tools">
            <label class="btn ghost file-label">
              选择文件
              <input id="fileInput" type="file" multiple hidden />
            </label>
            <label id="directoryLabel" class="btn ghost file-label">
              选择文件夹
              <input id="directoryInput" type="file" webkitdirectory directory multiple hidden />
            </label>
          </div>
          <div id="dropZone" class="drop-zone">
            <span class="drop-icon" aria-hidden="true">⇪</span>
            <span>把文件或文件夹拖到这里，或点击选择</span>
          </div>
          <div id="selectionList" class="list empty-box"></div>
          <button id="sendBtn" type="button" class="btn primary block" disabled>发起传输</button>
        </article>

        <article id="chatCard" class="card" aria-label="互发消息">
          <div class="card-head">
            <h2>互发消息</h2>
            <span id="chatHint" class="badge muted">未选择设备</span>
          </div>
          <p class="target-line">当前会话：<strong id="chatPeerName">未选择</strong></p>
          <div id="chatList" class="list empty-box"></div>
          <div id="chatPending" class="chat-pending" hidden></div>
          <div class="chat-compose">
            <div class="chat-input-row">
              <button id="chatAttachBtn" type="button" class="icon-btn chat-attach" title="添加图片或文件" aria-label="添加图片或文件">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21.4 11.1-9.2 9.2a5 5 0 0 1-7.1-7.1l9.2-9.2a3.3 3.3 0 0 1 4.7 4.7l-9.2 9.2a1.7 1.7 0 0 1-2.4-2.4l8.5-8.5" />
                </svg>
              </button>
              <textarea id="chatInput" rows="2" maxlength="1000" placeholder="输入要发送的消息，Enter 发送；可直接粘贴截图"></textarea>
            </div>
            <button id="chatSendBtn" type="button" class="btn primary" disabled>发送</button>
          </div>
          <input id="chatFileInput" type="file" multiple hidden />
        </article>

        <article id="historyCard" class="card" aria-label="历史记录">
          <div class="card-head">
            <h2>历史记录</h2>
            <button id="clearHistoryBtn" type="button" class="btn ghost mini">清空</button>
          </div>
          <div id="historyList" class="list empty-box"></div>
        </article>
      </section>

      <section class="card transfer-card" aria-label="当前传输">
        <div class="card-head">
          <h2>当前传输</h2>
          <div class="card-actions">
            <button id="transferActionBtn" type="button" class="btn ghost mini danger-ghost" hidden>停止传输</button>
            <span id="transferBadge" class="badge muted">空闲</span>
          </div>
        </div>
        <div id="transferProgress" class="progress" hidden></div>
        <div id="transferLog" class="list empty-box log-list"></div>
      </section>
    </main>

    <script type="module" src="/static/js/ui/main.js"></script>

    <div id="inviteModal" class="modal-overlay" hidden>
      <div class="modal-card" role="dialog" aria-label="扫码加入房间">
        <div class="modal-head">
          <h2>扫码加入房间</h2>
          <button id="inviteClose" type="button" class="icon-btn" aria-label="关闭" title="关闭">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18" /><path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <canvas id="inviteQr" class="invite-qr" width="10" height="10" aria-label="房间二维码"></canvas>
        <p class="invite-url"><code id="inviteUrl" class="ellipsis"></code></p>
        <div class="invite-actions">
          <select id="inviteIp" class="invite-select" aria-label="选择局域网地址"></select>
          <button id="inviteCopy" type="button" class="btn ghost mini">复制链接</button>
        </div>
        <p class="invite-hint">手机连同一 Wi-Fi，扫码或复制链接后即可进入同一房间。</p>
      </div>
    </div>

    <input id="resumeFileInput" type="file" multiple hidden />
    <input id="resumeDirInput" type="file" webkitdirectory directory multiple hidden />
  </body>
</html>
